<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" role="img" aria-label="Contemporaneous capture versus after-the-fact attestation: at encode time both the process and the residue can be recorded; after the fact only the residue remains and the process is unrecoverable">
<!-- Hand-authored sidecar render of the third mermaid diagram in docs/research/rulespec-interop-poc.md
     (branch poc/rulespec-interop). Same nodes, edges, labels, and groupings as the mermaid source.
     Self-contained: no scripts, no external references, no url() asset loads (the only url(#...) uses
     are internal arrowhead marker fragments; marker id arwC is unique across the a/b/c sidecars). -->
<title>Contemporaneous capture vs after-the-fact attestation</title>
<defs>
<marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
</marker>
</defs>
<rect x="0" y="0" width="1060" height="560" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#24292f">

<!-- subgraph CONTEMP -->
<rect x="24" y="24" width="1012" height="240" rx="10" fill="#eef5f3" stroke="#7ba99e" stroke-width="1.2"/>
<text x="530" y="46" font-size="13" font-weight="600" text-anchor="middle" fill="#3d4750">contemporaneous capture — at encode time</text>
<!-- RUNL -->
<rect x="44" y="110" width="230" height="64" rx="7" fill="#ffffff" stroke="#9aa5ad"/>
<text x="159" y="134" font-size="13" text-anchor="middle">encoding run</text>
<text x="159" y="150" font-size="13" text-anchor="middle">(non-deterministic, judgment-laden)</text>
<!-- PROCL -->
<rect x="356" y="60" width="300" height="76" rx="7" fill="#ffffff" stroke="#9aa5ad"/>
<text x="506" y="82" font-size="13" text-anchor="middle">process — captured live:</text>
<text x="506" y="98" font-size="13" text-anchor="middle">source pin, instruction, model,</text>
<text x="506" y="114" font-size="13" text-anchor="middle">oracle references compared</text>
<!-- RESL -->
<rect x="356" y="164" width="300" height="64" rx="7" fill="#ffffff" stroke="#9aa5ad"/>
<text x="506" y="188" font-size="13" text-anchor="middle">residue — the artifact bytes</text>
<text x="506" y="204" font-size="13" text-anchor="middle">(what the witnessed journal binds)</text>
<!-- NODEL -->
<rect x="730" y="110" width="286" height="64" rx="7" fill="#ffffff" stroke="#56845e" stroke-width="1.4"/>
<text x="873" y="134" font-size="13" font-weight="600" text-anchor="middle">node emitted at encode time:</text>
<text x="873" y="150" font-size="13" text-anchor="middle">process + residue, both signed</text>
<!-- CONTEMP edges -->
<path d="M 274 128 C 305 118, 320 108, 352 100" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#arwC)"/>
<path d="M 274 156 C 305 166, 320 176, 352 188" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#arwC)"/>
<path d="M 656 106 C 690 112, 700 122, 726 132" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#arwC)"/>
<path d="M 656 192 C 690 182, 700 168, 726 156" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#arwC)"/>

<!-- subgraph BACKFILL -->
<rect x="24" y="296" width="1012" height="240" rx="10" fill="#f7f2ec" stroke="#b9a58c" stroke-width="1.2"/>
<text x="530" y="318" font-size="13" font-weight="600" text-anchor="middle" fill="#3d4750">after-the-fact attestation — backfill</text>
<!-- RUNB -->
<rect x="44" y="382" width="230" height="64" rx="7" fill="#ffffff" stroke="#9aa5ad"/>
<text x="159" y="406" font-size="13" text-anchor="middle">encoding run</text>
<text x="159" y="422" font-size="13" text-anchor="middle">(already over, unrecorded)</text>
<!-- PROCB -->
<rect x="356" y="332" width="300" height="76" rx="7" fill="#ffffff" stroke="#9aa5ad" stroke-dasharray="5 4"/>
<text x="506" y="354" font-size="13" text-anchor="middle">process — UNRECOVERABLE:</text>
<text x="506" y="370" font-size="13" text-anchor="middle">re-running today reproduces the artifact,</text>
<text x="506" y="386" font-size="13" text-anchor="middle">not the original event</text>
<!-- RESB -->
<rect x="356" y="436" width="300" height="64" rx="7" fill="#ffffff" stroke="#9aa5ad"/>
<text x="506" y="460" font-size="13" text-anchor="middle">residue — the bytes as they stand now</text>
<text x="506" y="476" font-size="13" text-anchor="middle">(digests + source pins, attestable today)</text>
<!-- NODEB -->
<rect x="730" y="436" width="286" height="64" rx="7" fill="#ffffff" stroke="#9aa5ad"/>
<text x="873" y="460" font-size="13" font-weight="600" text-anchor="middle">backfill node:</text>
<text x="873" y="476" font-size="13" text-anchor="middle">present-day observables only</text>
<!-- BACKFILL edges -->
<path d="M 274 400 C 305 390, 320 380, 352 372" fill="none" stroke="#57606a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arwC)"/>
<rect x="278" y="336" width="140" height="18" fill="#f7f2ec"/>
<text x="348" y="349" font-size="12" font-style="italic" text-anchor="middle" fill="#57606a">nothing was captured</text>
<path d="M 274 428 C 305 438, 320 448, 352 460" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#arwC)"/>
<path d="M 656 464 C 686 466, 700 466, 726 466" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#arwC)"/>

</g>
</svg>
