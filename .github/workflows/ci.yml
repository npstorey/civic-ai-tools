# CI for civic-ai-tools.
#
# CHARTER: credential-free. This workflow references no repository or org
# secret anywhere (the context expression for one appears nowhere below), and
# uses no third-party actions beyond actions/checkout and actions/setup-node.
# Keep it that way: the audit is a grep for that expression. The only network access
# beyond the npm registry is the skill-drift step's unauthenticated GET of
# public raw files from the socrata-mcp-server repo, and the template-env
# step's unauthenticated shallow clone of that same public repo.
#
# NODE VERSION: the root manifest declares no `engines`; the one workspace
# (packages/civic-typed-harness) declares `node >= 18`. Node 22 is used because
# the harness's test script runs `node --test --experimental-strip-types`,
# which needs >= 22.6, and because 22 is what the phase was verified on
# (v22.23.1 / npm 10.9.8).
#
# INSTALL: plain `npm ci`, deliberately WITHOUT --ignore-scripts. The harness
# manifest carries `prepare: npm run build`, and npm 10.x runs workspace
# `prepare` scripts even under --ignore-scripts, so the flag would buy nothing
# here — it would only mask the fact that install builds the package. That
# `prepare` is benign in this repo (one workspace; its single runtime
# dependency, @typedstandards/produce-core, resolves from the registry rather
# than from a sibling workspace's unbuilt dist) and it has consumers outside
# CI, so it stays. Verified on a fresh clone: `npm ci` succeeds and leaves
# packages/civic-typed-harness/dist populated.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The root scripts fan out over `--workspaces --if-present`; today that is
      # exactly packages/civic-typed-harness. Keeping the fanout form means a
      # second package is covered the day it lands.
      - name: Build (harness)
        run: npm run build

      # Includes the golden byte-compat suite — golden-reproduction.test.ts and
      # composition-roundtrip.test.ts ride `npm test`; they are the acceptance
      # bar ADR-0022 §Consequences sets for the harness relocation.
      - name: Test (harness, incl. golden byte-compat)
        run: npm test

      # Runs TWO tsconfigs: the build config, and tsconfig.test.json, which
      # carries `src/**/*.test.ts` — excluded from the build config because
      # that one emits the published `dist/`. Before civic-ai-tools#197 the
      # test files were in neither, and a `const x: number = "not a number"`
      # in one of them passed `npm test`, this step, AND the lint step.
      - name: Typecheck (harness, build config + test config)
        run: npm run typecheck

      - name: Lint (harness purity config)
        run: npm run lint

      - name: Dependency-budget checker self-test
        run: npm run check:budgets:self-test

      - name: Dependency-budget check
        run: npm run check:budgets

      # Validates the Typed Standards Specification's YAML frontmatter: known
      # keys only, no mapping indicator inside a plain scalar (the v0.1.5
      # defect, which shipped machine-unreadable version metadata to an
      # external integrator), a full patch Version, and a Tag that agrees with
      # it. Placed with the other hermetic checks, ahead of the one step that
      # depends on the network.
      - name: Spec-frontmatter checker self-test
        run: npm run check:spec-frontmatter:self-test

      - name: Spec-frontmatter check
        run: npm run check:spec-frontmatter

      # Every statement of the ratified attestation sub-type table in the
      # specification must list the same sub-types as the §8.12.1 table, read
      # from the specification's text (civic-ai-tools#230: the §7.4
      # statements had omitted attestation/revises/v1). A statement the check
      # expects and cannot find fails, as does a restatement it does not know.
      # Hermetic (one file read), so it sits with the other hermetic checks.
      - name: Spec sub-type-table checker self-test
        run: npm run check:spec-subtype-table:self-test

      - name: Spec sub-type-table check
        run: npm run check:spec-subtype-table

      # The attestation/* members of the reference verifier's registered set
      # (KNOWN_TYPE_URIS, exported by @typedstandards/verify-core from 0.11.0)
      # must equal the specification's §8.12.1 table (civic-ai-tools#232). The
      # set is read from the package `npm ci` installed, as the harness resolves
      # it; an installed release without the export fails rather than skipping.
      # Hermetic after install (one file read, one local import).
      - name: Verifier sub-type-set checker self-test
        run: npm run check:verifier-subtype-set:self-test

      - name: Verifier sub-type-set check
        run: npm run check:verifier-subtype-set

      # Guards AGENTS.md's Commands table: no cell pins a count the runner
      # outgrows, every command it names is a real script, and its command set
      # equals THIS FILE's — in both directions, so a gate added here without a
      # row, or a row without a step, fails. Hermetic (two file reads), so it
      # sits with the other hermetic checks, ahead of the one networked step.
      - name: Gate-table check (AGENTS.md ↔ ci.yml)
        run: npm run check:gate-table

      - name: Skill-drift checker self-test
        run: npm run check:skill-drift:self-test

      # Compares docs/skills/{base,local,web}.md — the source of truth per
      # docs/skills/README.md §Governance — against the copies embedded in
      # socrata-mcp-server@main, fetched unauthenticated from
      # raw.githubusercontent.com. This is the one step whose result depends on
      # another repo's state; a fetch failure fails the job rather than passing
      # quietly, on the principle that a check which cannot run has not passed.
      - name: Skill-drift check
        run: npm run check:skill-drift

      - name: Template-env checker self-test
        run: npm run check:template-env:self-test

      # Every environment variable a tracked MCP template sets for the Socrata
      # MCP server must have a reader: the server's own source at main, or a
      # runtime reader the check names with its reason. The server source comes
      # from a shallow `git clone` over public HTTPS, not the REST API, which is
      # rate-limited per IP on shared runners. The clone runs outside this
      # checkout with global and system git config ignored, so it carries no
      # credential; a clone failure fails the step (civic-ai-tools-website#434).
      - name: Template-env check
        run: npm run check:template-env

      # The publish-record skill's tests (45 of them) ran only by hand until
      # this step — the gap recorded at civic-ai-tools#160 G5. They are
      # hermetic: every server response is stubbed, two of those stubs raise on
      # any call that reaches the network, no credential or token is read, and
      # nothing outside a TemporaryDirectory is written. ubuntu-latest ships a
      # python3, so this needs no setup-python step — which also keeps the
      # workflow's action list at checkout + setup-node, as the charter above
      # requires. `python3 --version` is echoed so the log records which
      # interpreter the result came from.
      - name: Test (publish-record skill, python)
        run: |
          python3 --version
          python3 .claude/skills/publish-record/test_publish.py
